{% extends "layout.html" %}
{% block title %}User Profile{% endblock %}

{% block content %}

<div class="max-w-3xl mx-auto space-y-10">

  <!-- Page Title -->
  <h1 class="text-3xl font-bold text-gray-800 mb-6 flex items-center">
    <svg class="w-8 h-8 mr-3 text-blue-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
        d="M5.121 17.804A13.937 13.937 0 0112 15c2.5 0 4.847.655 6.879 1.804M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
    </svg>
    User Profile
  </h1>

  <!-- Profile Info Card -->
  <div class="bg-white shadow-lg rounded-lg p-6 border border-gray-100">
    <h2 class="text-xl font-semibold text-gray-800 mb-4">Profile Information</h2>

    <form class="space-y-5">

      <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">First Name</label>
          <input id="first_name" type="text"
            class="w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 py-2 px-3">
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Last Name</label>
          <input id="last_name" type="text"
            class="w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 py-2 px-3">
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
        <input id="email" type="email"
          class="w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 py-2 px-3">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
        <input id="username" type="text"
          class="w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 py-2 px-3">
      </div>

      <button id="saveProfileBtn"
        class="bg-blue-700 text-white px-6 py-2 rounded-md hover:bg-blue-800 transition-colors duration-200 font-medium flex items-center">
        <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M5 13l4 4L19 7" />
        </svg>
        Save Profile
      </button>

    </form>
  </div>

  <!-- Password Change Card -->
  <div class="bg-white shadow-lg rounded-lg p-6 border border-gray-100">
    <h2 class="text-xl font-semibold text-gray-800 mb-4">Change Password</h2>

    <form class="space-y-5">

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Old Password</label>
        <input id="old_password" type="password"
          class="w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 py-2 px-3">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">New Password</label>
        <input id="new_password" type="password"
          class="w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 py-2 px-3">
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Confirm New Password</label>
        <input id="confirm_new_password" type="password"
          class="w-full border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 py-2 px-3">
      </div>

      <button id="changePasswordBtn"
        class="bg-yellow-600 text-white px-6 py-2 rounded-md hover:bg-yellow-700 transition-colors duration-200 font-medium flex items-center">
        <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M12 11c0-1.105-.895-2-2-2s-2 .895-2 2m4 0c0 1.105.895 2 2 2s2-.895 2-2m-6 4h6" />
        </svg>
        Change Password
      </button>

    </form>
  </div>

</div>

{% endblock %}

{% block scripts %}
<script>
document.addEventListener("DOMContentLoaded", () => {

  const token = localStorage.getItem("access_token");
  const user = JSON.parse(localStorage.getItem("user"));

  if (!token || !user) {
    window.location.href = "/login";
    return;
  }

  // Pre-fill fields
  document.getElementById("first_name").value = user.first_name;
  document.getElementById("last_name").value = user.last_name;
  document.getElementById("email").value = user.email;
  document.getElementById("username").value = user.username;

  // Save Profile
  document.getElementById("saveProfileBtn").addEventListener("click", async (e) => {
    e.preventDefault();

    const body = {
      first_name: document.getElementById("first_name").value,
      last_name: document.getElementById("last_name").value,
      email: document.getElementById("email").value,
      username: document.getElementById("username").value
    };

    const res = await fetch("/profile/me", {
      method: "PUT",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${token}`
      },
      body: JSON.stringify(body)
    });

    const data = await res.json();

    if (!res.ok) {
      showToast(data.detail || "Error updating profile", "error");
      return;
    }

    localStorage.setItem("user", JSON.stringify(data));
    showToast("Profile updated successfully", "success");
  });

  // Change Password
  document.getElementById("changePasswordBtn").addEventListener("click", async (e) => {
    e.preventDefault();

    const old_password = document.getElementById("old_password").value;
    const new_password = document.getElementById("new_password").value;
    const confirm = document.getElementById("confirm_new_password").value;

    if (new_password !== confirm) {
      showToast("New passwords do not match", "error");
      return;
    }

    const res = await fetch("/profile/me/password", {
      method: "PUT",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${token}`
      },
      body: JSON.stringify({ old_password, new_password })
    });

    const data = await res.json();

    if (!res.ok) {
      showToast(data.detail || "Error changing password", "error");
      return;
    }

    showToast("Password changed successfully. Logging out...", "success");

    setTimeout(() => {
      localStorage.clear();
      window.location.href = "/login";
    }, 1500);
  });

});
</script>
{% endblock %}
