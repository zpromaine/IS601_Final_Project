<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Profile</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>

<div class="container">
    <h1>User Profile</h1>

    <div id="messages"></div>

    <h2>Update Profile</h2>
    <form id="profile-form">
        <label>First Name</label>
        <input id="first_name" type="text">

        <label>Last Name</label>
        <input id="last_name" type="text">

        <label>Email</label>
        <input id="email" type="email">

        <label>Username</label>
        <input id="username" type="text">

        <button type="submit">Save Profile</button>
    </form>

    <hr>

    <h2>Change Password</h2>
    <form id="password-form">
        <label>Old Password</label>
        <input id="old_password" type="password">

        <label>New Password</label>
        <input id="new_password" type="password">

        <label>Confirm New Password</label>
        <input id="confirm_new_password" type="password">

        <button type="submit">Change Password</button>
    </form>

    <hr>

    <button id="logout">Logout</button>
</div>

<!-- INLINE JS — matches your existing app structure -->
<script>
function showMessage(msg, type="success") {
    const box = document.getElementById("messages");
    box.innerHTML = \`<div class="\${type}-message">\${msg}</div>\`;
}

function loadProfile() {
    const token = localStorage.getItem("access_token");
    const user = JSON.parse(localStorage.getItem("user"));

    if (!token || !user) {
        window.location.href = "/login";
        return;
    }

    document.getElementById("first_name").value = user.first_name;
    document.getElementById("last_name").value = user.last_name;
    document.getElementById("email").value = user.email;
    document.getElementById("username").value = user.username;
}

document.getElementById("profile-form").addEventListener("submit", async (e) => {
    e.preventDefault();

    const token = localStorage.getItem("access_token");

    const body = {
        first_name: document.getElementById("first_name").value,
        last_name: document.getElementById("last_name").value,
        email: document.getElementById("email").value,
        username: document.getElementById("username").value
    };

    const res = await fetch("/profile/me", {
        method: "PUT",
        headers: {
            "Content-Type": "application/json",
            "Authorization": \`Bearer \${token}\`
        },
        body: JSON.stringify(body)
    });

    const data = await res.json();

    if (!res.ok) {
        showMessage(data.detail || "Error updating profile", "error");
        return;
    }

    localStorage.setItem("user", JSON.stringify(data));
    showMessage("Profile updated successfully!");
});

document.getElementById("password-form").addEventListener("submit", async (e) => {
    e.preventDefault();

    const token = localStorage.getItem("access_token");

    const old_password = document.getElementById("old_password").value;
    const new_password = document.getElementById("new_password").value;
    const confirm = document.getElementById("confirm_new_password").value;

    if (new_password !== confirm) {
        showMessage("New passwords do not match", "error");
        return;
    }

    const res = await fetch("/profile/me/password", {
        method: "PUT",
        headers: {
            "Content-Type": "application/json",
            "Authorization": \`Bearer \${token}\`
        },
        body: JSON.stringify({ old_password, new_password })
    });

    const data = await res.json();

    if (!res.ok) {
        showMessage(data.detail || "Error changing password", "error");
        return;
    }

    showMessage("Password changed successfully! Logging out...");

    setTimeout(() => {
        localStorage.clear();
        window.location.href = "/login";
    }, 1500);
});

document.getElementById("logout").addEventListener("click", () => {
    localStorage.clear();
    window.location.href = "/login";
});

loadProfile();
</script>

</body>
</html>

<script>
document.addEventListener("DOMContentLoaded", () => {

  // Redirect if not logged in
  const token = localStorage.getItem("access_token");
  const user = JSON.parse(localStorage.getItem("user"));

  if (!token || !user) {
    window.location.href = "/login";
    return;
  }

  // Pre-fill profile fields
  document.getElementById("first_name").value = user.first_name;
  document.getElementById("last_name").value = user.last_name;
  document.getElementById("email").value = user.email;
  document.getElementById("username").value = user.username;

  // Save Profile
  document.getElementById("saveProfileBtn").addEventListener("click", async (e) => {
    e.preventDefault();

    const body = {
      first_name: document.getElementById("first_name").value,
      last_name: document.getElementById("last_name").value,
      email: document.getElementById("email").value,
      username: document.getElementById("username").value
    };

    const res = await fetch("/profile/me", {
      method: "PUT",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${token}`
      },
      body: JSON.stringify(body)
    });

    const data = await res.json();

    if (!res.ok) {
      showToast(data.detail || "Error updating profile", "error");
      return;
    }

    // Update localStorage
    localStorage.setItem("user", JSON.stringify(data));

    showToast("Profile updated successfully", "success");
  });

  // Change Password
  document.getElementById("changePasswordBtn").addEventListener("click", async (e) => {
    e.preventDefault();

    const old_password = document.getElementById("old_password").value;
    const new_password = document.getElementById("new_password").value;
    const confirm = document.getElementById("confirm_new_password").value;

    if (new_password !== confirm) {
      showToast("New passwords do not match", "error");
      return;
    }

    const res = await fetch("/profile/me/password", {
      method: "PUT",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${token}`
      },
      body: JSON.stringify({ old_password, new_password })
    });

    const data = await res.json();

    if (!res.ok) {
      showToast(data.detail || "Error changing password", "error");
      return;
    }

    showToast("Password changed successfully. Logging out...", "success");

    setTimeout(() => {
      localStorage.clear();
      window.location.href = "/login";
    }, 1500);
  });

});
</script>
