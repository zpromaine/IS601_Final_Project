{% extends "layout.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="min-h-screen flex flex-col justify-center py-8 sm:py-12 bg-gray-100">
  <div class="sm:mx-auto sm:w-full sm:max-w-md">
    <h2 class="text-center text-3xl font-bold tracking-tight text-gray-800">
      Welcome Back
    </h2>
    <p class="mt-2 text-center text-sm text-gray-600">
      Sign in to access your account
    </p>
  </div>

  <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
    <div class="bg-white py-8 px-6 shadow rounded-lg sm:px-10">

      <!-- Error Alert -->
      <div id="errorAlert" class="hidden bg-red-100 border border-red-500 text-red-800 px-4 py-3 rounded-md mb-4">
        <div class="flex items-center">
          <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"></path>
          </svg>
          <span id="errorMessage"></span>
        </div>
      </div>

      <!-- Success Alert -->
      <div id="successAlert" class="hidden bg-green-100 border border-green-500 text-green-800 px-4 py-3 rounded-md mb-4">
        <div class="flex items-center">
          <svg class="w-5 h-5 mr-2" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path>
          </svg>
          <span id="successMessage"></span>
        </div>
      </div>

      <!-- Login Form -->
      <form id="loginForm" class="space-y-6">
        <div>
          <label for="username" class="block text-sm font-medium text-gray-700">Username</label>
          <input type="text" id="username" name="username" required
                 class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
        </div>

        <div>
          <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
          <input type="password" id="password" name="password" required
                 class="mt-1 block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:ring-blue-500 focus:border-blue-500 sm:text-sm">
        </div>

        <div class="flex items-center justify-between">
          <label class="flex items-center">
            <input id="remember" name="remember" type="checkbox"
                   class="h-4 w-4 text-blue-700 border-gray-300 rounded">
            <span class="ml-2 text-sm text-gray-900">Remember me</span>
          </label>

          <a href="#" class="text-sm font-medium text-blue-700 hover:text-blue-800">
            Forgot password?
          </a>
        </div>

        <button type="submit"
                class="w-full flex justify-center py-2 px-4 rounded-md shadow-sm text-sm font-medium text-white bg-blue-700 hover:bg-blue-800 transition">
          Sign in
        </button>
      </form>

      <div class="mt-6 text-center text-sm text-gray-600">
        Don't have an account?
        <a href="/register" class="font-medium text-blue-700 hover:text-blue-800">Register now</a>
      </div>

    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', function() {

    const form = document.getElementById('loginForm');
    const errorAlert = document.getElementById('errorAlert');
    const errorMessage = document.getElementById('errorMessage');
    const successAlert = document.getElementById('successAlert');
    const successMessage = document.getElementById('successMessage');

    function showError(msg) {
        errorMessage.textContent = msg;
        errorAlert.classList.remove('hidden');
        successAlert.classList.add('hidden');
    }

    function showSuccess(msg) {
        successMessage.textContent = msg;
        successAlert.classList.remove('hidden');
        errorAlert.classList.add('hidden');
    }

    // FIXED: Store full user object
    function storeTokens(data) {
    localStorage.setItem('access_token', data.access_token);
    localStorage.setItem('refresh_token', data.refresh_token);
    localStorage.setItem('token_expires', data.expires_at);
    localStorage.setItem('user_id', data.user_id);
    localStorage.setItem('username', data.username);

    // Build the user object manually (backend returns flat fields)
    const userObj = {
        first_name: data.first_name,
        last_name: data.last_name,
        email: data.email,
        username: data.username
    };

    localStorage.setItem('user', JSON.stringify(userObj));
}

    form.addEventListener('submit', async function(e) {
        e.preventDefault();

        errorAlert.classList.add('hidden');
        successAlert.classList.add('hidden');

        const payload = {
            username: form.username.value.trim(),
            password: form.password.value
        };

        try {
            const response = await fetch('/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await response.json();

            if (!response.ok) {
                showError(data.detail || 'Login failed');
                return;
            }

            storeTokens(data);
            showSuccess('Login successful! Redirecting...');

            setTimeout(() => {
                window.location.href = '/dashboard';
            }, 800);

        } catch (err) {
            showError('Unable to login');
        }
    });

});
</script>
{% endblock %}
